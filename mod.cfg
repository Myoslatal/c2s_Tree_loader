# Cell to Singularity - mod configuration
#
# Read by CustomEventPack.PatchHooks at runtime. Lines are "key = value";
# a line starting with # or ; is a comment. Editing this file takes effect
# within about a second - no restart and no re-patching needed.

# Multiplier applied to every tap (manual taps and the Assistant auto-tap alike).
# 5 = the classic "every tap is worth 5". 1 = vanilla behaviour. 0 = taps pay nothing.
tap_scale = 5
